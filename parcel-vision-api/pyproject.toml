[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-vision-api"
version = "1.0.0"
description = "3D point-cloud parcel segmentation and robot grasp localization API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.7,<4"]

[project.scripts]
parcel-vision-api = "parcel_vision.api:main"
parcel-vision-client = "parcel_vision.api_client:main"

[tool.setuptools.packages.find]
include = ["parcel_vision*"]
