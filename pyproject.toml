[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sorting-vision-anomaly-detection"
version = "0.2.0"
description = "Parcel sorting video detection, tracking and anomaly research project"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
annotation = ["requests>=2.32,<3"]
documents = ["python-docx>=1.1,<2"]
export = ["onnx>=1.16,<2", "onnxslim>=0.1,<1", "onnxruntime>=1.18,<2"]

[tool.setuptools]
packages = ["sorting_vision"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
