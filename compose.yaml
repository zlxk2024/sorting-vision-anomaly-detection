services:
  sorting-vision:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SORTING_API_KEY: ${SORTING_API_KEY:-}
    volumes:
      - ./runs/api:/work/jobs
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
