services:
  sorting-realtime:
    build: .
    command: ["python", "-m", "sorting_vision.realtime", "--config", "/app/config/realtime.example.yaml"]
    env_file: .env
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config:/app/config:ro
      - ./runs/realtime:/work/realtime
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; r=json.load(urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=5)); exit(0 if r['ready'] else 1)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 3
